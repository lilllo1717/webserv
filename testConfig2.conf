# ===================
# Webserv config file
# ===================

server {
    listen 127.0.0.1:8080;
    server_name webserv.com;

    client_max_body_size 10M;

    error_page 403 ./error_pages/403.html;
    error_page 404 ./error_pages/404.html;
    error_page 500 ./error_pages/500.html;

    # ── Static website ──────────────────────────
    location / {
        methods GET;
        root ./www;
        index index.html;
        autoindex on;
    }

    location /public {
        methods GET;
        root ./www;
        index index.html;
        autoindex on;
    }

    # ── Redirects ────────────────────────────────
    location /old {
        methods GET;
        return 301 "/new?from=old&x=1";
    }

    location /new {
        methods GET;
        root ./www;
        index index.html;
    }

    # ── File upload (non-CGI) ────────────────────
    location /upload {
        methods POST;
        root ./uploads;
        upload_store ./uploads;
    }

    # ── Serve + delete uploaded files ────────────
    location /uploads {
        methods GET DELETE;
        root ./uploads;
        autoindex on;
    }

    # ── CGI scripts ──────────────────────────────
    location /cgi-bin {
        methods GET POST;
        root ./cgi-bin;
        cgi .php /usr/bin/php-cgi;
        cgi .py  /usr/bin/python3;
    }
}
