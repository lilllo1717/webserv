# ===================
# Webserv config file
# ===================

server {
    listen 127.0.0.1:8080;
    server_name webserv.com;

    client_max_body_size 10M;

    error_page 403 ./error_pages/403.html;
    error_page 404 ./error_pages/404.html;
    error_page 500 ./error_pages/500.html;

    # ── Static website ──────────────────────────
    location / {
        methods GET;
        root ./www;
        index index.html;
        autoindex on;
    }

    location /public {
        methods GET;
        root ./www;
        index index.html;
        autoindex on;
    }

    # ── Redirects ────────────────────────────────
    location /old {
        methods GET;
        return 301 "/new?from=old&x=1";
    }

    location /new {
        methods GET;
        root ./www;
        index index.html;
    }

    # ── File upload (non-CGI) ────────────────────
    location /upload {
        methods POST;
        root ./uploads;
        upload_store ./uploads;
    }

    # ── Serve + delete uploaded files ────────────
    location /uploads {
        methods GET DELETE;
        root ./uploads;
        autoindex on;
    }

    # ── CGI scripts ──────────────────────────────
    location /cgi-bin {
        methods GET POST;
        root ./cgi-bin;
        cgi .php /usr/bin/php-cgi;
        cgi .py  /usr/bin/python3;
    }
}


# ── Tests: tiny body limit ───────────────────────────────────────
# curl -X POST http://127.0.0.1:8081/upload --data "hello" → 200
# curl -X POST http://127.0.0.1:8081/upload --data "this is way more than one hundred bytes of data being sent to trigger the limit" → 413
server {
    listen 127.0.0.1:8081;
    server_name small.com;

    client_max_body_size 100;

    error_page 404 ./error_pages/404.html;
    error_page 500 ./error_pages/500.html;

    location / {
        methods GET;
        root ./www;
        index index.html;
        autoindex on;
    }

    location /upload {
        methods POST;
        root ./uploads;
        upload_store ./uploads;
    }
}

# ── Tests: virtual hosting (same port as 8080, different Host header) ──
# curl -H "Host: site-a.com" http://127.0.0.1:8080/        → this server
# curl -H "Host: webserv.com" http://127.0.0.1:8080/       → first server
# curl -H "Host: unknown.com" http://127.0.0.1:8080/       → falls back to first server on 8080
server {
    listen 127.0.0.1:8080;
    server_name site-a.com;

    client_max_body_size 10M;

    error_page 404 ./error_pages/404.html;

    location / {
        methods GET;
        root ./www;
        index index.html;
        autoindex off;
    }

    location /cgi-bin {
        methods GET POST;
        root ./cgi-bin;
        cgi .php /usr/bin/php-cgi;
        cgi .py  /usr/bin/python3;
    }
}