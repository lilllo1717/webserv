# ═══════════════════════════════════════════════════════════════
# Main website — example.com on :8080
# ═══════════════════════════════════════════════════════════════
server {
    listen 127.0.0.1:8080;
    server_name example.com;

    client_max_body_size 5M;

    error_page 403 ./error_pages/403.html;
    error_page 404 ./error_pages/404.html;
    error_page 500 ./error_pages/500.html;

    # Serves ./www/index.html
    location / {
        methods GET;
        root ./www;
        index index.html;
        autoindex off;
    }

    # You actually have ./www/testAutoindex/ with test.txt inside
    # this is the real use case for autoindex — a specific browsable dir
    location /testAutoindex {
        methods GET;
        root ./www;
        autoindex on;
    }

    # Old URL redirect
    location /old-page {
        methods GET;
        return 301 /new-page;
    }

    location /new-page {
        methods GET;
        root ./www;
        index index.html;
    }

    # POST files here → stored in ./uploads/
    location /upload {
        methods POST;
        upload_store ./uploads;
    }

    # Browse and delete what's in ./uploads/
    # you already have cat.jpg, testfile.txt etc in there
    location /uploads {
        methods GET DELETE;
        root ./uploads;
        autoindex on;
    }

    # You have hello.php, image.php, info.py, worldclock.py
    location /worldClock {
        methods GET POST;
        root ./cgi-bin;
        cgi .php /usr/bin/php-cgi;
        cgi .py  /usr/bin/python3;
    }
}

# ═══════════════════════════════════════════════════════════════
# Virtual host — same port, different Host header
# curl -H "Host: other.com" http://127.0.0.1:8080/
# ═══════════════════════════════════════════════════════════════
server {
    listen 127.0.0.1:8080;
    server_name other.com;

    error_page 404 ./error_pages/404.html;
    error_page 500 ./error_pages/500.html;

    # same www root but autoindex on so it behaves differently
    # from example.com which has autoindex off
    location / {
        methods GET;
        root ./www;
        index index.html;
        autoindex on;
    }

    location /cgi-bin {
        methods GET POST;
        root ./cgi-bin;
        cgi .php /usr/bin/php-cgi;
        cgi .py  /usr/bin/python3;
    }
}

# ═══════════════════════════════════════════════════════════════
# Strict body limit — tests 413
# ═══════════════════════════════════════════════════════════════
server {
    listen 127.0.0.1:8081;
    server_name small.com;

    client_max_body_size 100;

    error_page 404 ./error_pages/404.html;
    error_page 500 ./error_pages/500.html;

    location / {
        methods GET;
        root ./www;
        index index.html;
        autoindex off;
    }

    location /upload {
        methods POST;
        upload_store ./uploads;
    }
}